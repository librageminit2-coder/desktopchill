<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Site & Learn — desktopchill admin</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#0a0b0e; --surface:rgba(22,24,31,.66); --surface-solid:#16181f; --surface-hover:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.16);
  --text:#f2f3f7; --text-dim:#a2a6b4; --text-faint:#6d7180;
  --accent:#ff6a58; --accent-2:#ffab6b; --accent-grad:linear-gradient(120deg,#ff6a58,#ffab6b); --accent-shadow:rgba(255,106,88,.4);
  --pos:#3ddc84; --pos-bg:rgba(61,220,132,.14); --neg:#ff6b6b; --neg-bg:rgba(255,107,107,.14); --warn:#ffcb52; --warn-bg:rgba(255,203,82,.14); --info:#7aa7ff;
  --shadow:0 18px 50px rgba(0,0,0,.5); --shadow-sm:0 8px 22px rgba(0,0,0,.4);
  --radius:18px; --font-display:'Instrument Serif',Georgia,serif;
  --blur:blur(18px) saturate(150%);
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none} button,input,select{font:inherit;color:inherit} button{cursor:pointer;background:none;border:0}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.bg-layer{position:fixed;inset:0;z-index:-2;overflow:hidden;background:var(--bg)}
.bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s}
.bg-video.ready{opacity:.55}
.bg-layer::after{content:"";position:absolute;inset:0;background:rgba(9,10,13,.62)}
.wrap{width:min(1360px,100%);margin:0 auto;padding:0 clamp(14px,3vw,30px)}
main{padding:104px 0 90px}
/* header */
.site-header{position:fixed;top:14px;left:0;right:0;z-index:100;display:flex;justify-content:center;padding:0 14px}
.header-inner{width:min(1360px,100%);display:flex;align-items:center;gap:14px;padding:9px 10px 9px 16px;background:var(--surface);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:999px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.1rem;letter-spacing:-.02em;flex-shrink:0}
.logo svg{width:32px;height:32px;color:var(--accent)}
.logo b{color:var(--accent)} .logo small{font-size:.66rem;font-weight:600;color:var(--text-faint);margin-left:2px}
.main-nav{display:flex;gap:4px;margin:0 auto}
.nav-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:999px;color:var(--text-dim);font-weight:600;font-size:.92rem;transition:.2s;white-space:nowrap}
.nav-btn svg{width:17px;height:17px}
.nav-btn:hover{background:var(--surface-hover);color:var(--text)}
.nav-btn.active{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.header-actions{display:flex;gap:6px;align-items:center}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;min-width:40px;padding:0 13px;border-radius:999px;border:1px solid var(--border);color:var(--text);font-weight:700;font-size:.88rem;transition:.2s}
.icon-btn:hover{background:var(--surface-hover);border-color:var(--border-strong)}
.icon-btn svg{width:17px;height:17px}
@media (max-width:1100px){.nav-btn span,.icon-btn span{display:none}.nav-btn{padding:8px 11px}}
@media (max-width:640px){.logo small,.logo .lt{display:none}.header-inner{gap:6px;padding:7px 7px 7px 12px}}
/* common */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-title{font-family:var(--font-display);font-weight:400;font-size:clamp(2.2rem,5vw,3.2rem);line-height:1;letter-spacing:-.01em}
.page-sub{color:var(--text-dim);font-size:.94rem;margin-top:6px;max-width:70ch}
.segment{display:inline-flex;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:999px;padding:4px;gap:2px}
.segment button{padding:8px 15px;color:var(--text-dim);font-weight:600;font-size:.86rem;border-radius:999px;transition:.25s;white-space:nowrap}
.segment button:hover{color:var(--text)}
.segment button.active{background:var(--accent-grad);color:#fff;box-shadow:0 4px 12px var(--accent-shadow)}
.card{background:var(--surface);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,.05)}
.card.pad{padding:18px}
.card h3{font-size:.98rem;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h3 em{margin-left:auto;font-style:normal;font-size:.78rem;font-weight:600;color:var(--text-faint)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat{padding:16px 16px 14px}
.stat .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.stat .ico svg{width:18px;height:18px}
.stat.accent .ico{background:var(--accent-grad);color:#fff;box-shadow:0 6px 16px var(--accent-shadow)}
.stat .lbl{font-size:.8rem;color:var(--text-dim);font-weight:600}
.stat .val{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.stat .foot{font-size:.76rem;color:var(--text-faint);margin-top:4px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pos);box-shadow:0 0 8px var(--pos);margin-right:6px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
@media (max-width:1000px){.grid-2,.grid-3{grid-template-columns:1fr}}
.bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr auto;gap:10px;align-items:center;font-size:.86rem}
.bar-row .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .t{height:7px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.bar-row .t i{display:block;height:100%;background:var(--accent-grad);border-radius:5px}
.bar-row .v{font-weight:700;font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
.chart{width:100%;height:220px}
.chart .gl{stroke:rgba(255,255,255,.07)}
.chart .lb{fill:var(--text-faint);font-size:10px}
.chart .bv{fill:url(#gradA)}
.chart .ln{fill:none;stroke:#7aa7ff;stroke-width:2}
.chart .dt{fill:#7aa7ff}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--text-dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-weight:600;font-size:.74rem;color:var(--text-faint);padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr.click{cursor:pointer}
tbody tr:hover{background:rgba(255,255,255,.035)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.who{display:flex;align-items:center;gap:10px;min-width:170px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);font-weight:800;font-size:.78rem;flex:none}
.av.emo{font-size:1rem}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:999px;font-size:.7rem;font-weight:700;background:rgba(255,255,255,.08);color:var(--text-dim);white-space:nowrap}
.pill.pos{background:var(--pos-bg);color:var(--pos)} .pill.neg{background:var(--neg-bg);color:var(--neg)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.acc{background:color-mix(in srgb,var(--accent) 20%,transparent);color:#ffc7bd}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:200px;height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--border-strong);background:rgba(0,0,0,.3)}
.search:focus{outline:none;border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid transparent;font-weight:700;font-size:.88rem;transition:transform .15s,box-shadow .2s,background .2s;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent-grad);color:#fff;box-shadow:0 8px 22px var(--accent-shadow)}
.btn-ghost{background:rgba(255,255,255,.05);border-color:var(--border-strong)}
.btn-ghost:hover{background:var(--surface-hover)}
.btn-danger{background:var(--neg-bg);color:var(--neg);border-color:color-mix(in srgb,var(--neg) 35%,transparent)}
.btn-sm{padding:7px 13px;font-size:.82rem}
.muted{color:var(--text-dim)} .faint{color:var(--text-faint)}
.empty{padding:28px;text-align:center;color:var(--text-dim)}
.note{font-size:.8rem;color:var(--text-faint);margin-top:10px}
.view{display:none}.view.active{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
/* drawer */
.drawer-bg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .2s}
.drawer{position:fixed;z-index:201;top:12px;right:12px;bottom:12px;width:min(560px,calc(100vw - 24px));overflow-y:auto;background:rgba(18,20,26,.95);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:22px;animation:slide .3s cubic-bezier(.2,.7,.2,1)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.drawer h2{font-family:var(--font-display);font-weight:400;font-size:2.2rem;line-height:1}
.drawer .x{position:absolute;right:14px;top:14px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.kv div{padding:10px;border-radius:14px;background:rgba(255,255,255,.04)}
.kv small{display:block;font-size:.72rem;color:var(--text-faint);font-weight:600}
.kv b{font-size:1.15rem}
.hm{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.hm i{aspect-ratio:1;border-radius:4px;background:rgba(255,255,255,.07)}
.hm i.l1{background:rgba(255,171,107,.35)}.hm i.l2{background:rgba(255,171,107,.65)}.hm i.l3{background:#ffab6b}
.sec{margin-top:18px}
.sec h4{font-size:.86rem;font-weight:700;margin-bottom:8px;color:var(--text-dim)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
/* gate */
.gate{min-height:70vh;display:grid;place-items:center}
.gate .card{max-width:420px;padding:28px;text-align:center;display:grid;gap:12px}
.gate input{height:46px;padding:0 16px;border-radius:999px;border:1px solid var(--border-strong);background:rgba(0,0,0,.3);text-align:center}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;z-index:300;padding:12px 20px;border-radius:999px;background:#fff;color:#16181f;font-weight:700;font-size:.9rem;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

    '<div class="sec"><h4>Bạn bè</h4>'+((u.friends||[]).map(function(f){return '<span class="pill '+(f.status==='accepted'?'':'warn')+'" style="margin:0 6px 6px 0">'+esc(f.name)+(f.status==='accepted'?'':' (chờ)')+'</span>'}).join('')||'<span class="faint">Không có</span>')+'</div>'+
    '<div class="sec"><h4>Quiz đã chơi</h4>'+((u.quizzes||[]).slice(0,8).map(function(q){return '<div class="bar-row" style="grid-template-columns:1fr auto"><span class="k">'+esc(q.title)+' <span class="faint">'+dt(q.at)+'</span></span><span class="v">'+q.correct+'/'+q.n+' · '+q.score+'</span></div>'}).join('')||'<span class="faint">Chưa chơi</span>')+'</div>'+
    '<div class="sec"><h4>Quản lý tài khoản</h4><div class="actions">'+(u.locked?'<button class="btn btn-ghost btn-sm" data-a="unlock">Mở khoá sai PIN</button>':'')+'<button class="btn btn-ghost btn-sm" data-a="reset_pin">Đặt lại PIN</button><button class="btn btn-ghost btn-sm" data-a="rename">Đổi tên</button><button class="btn btn-ghost btn-sm" data-a="logout">Đăng xuất mọi thiết bị</button>'+(u.banned?'<button class="btn btn-ghost btn-sm" data-a="unban">Mở khoá tài khoản</button>':'<button class="btn btn-danger btn-sm" data-a="ban">Khoá tài khoản</button>')+'<button class="btn btn-danger btn-sm" data-a="delete">Xoá tài khoản</button></div><p class="note">Đặt lại PIN: học viên sẽ phải đăng nhập lại bằng PIN mới. Xoá tài khoản là vĩnh viễn (mất cả tiến độ trên máy chủ, bạn bè và tư cách thành viên lớp).</p></div></aside>';
    document.body.appendChild(wrap);
    var close=function(){wrap.remove()};
    wrap.querySelector('.drawer-bg').onclick=close;wrap.querySelector('.x').onclick=close;
    wrap.querySelectorAll('[data-a]').forEach(function(b){b.onclick=async function(){
      var a=b.dataset.a,arg=null;
      if(a==='reset_pin'){arg=prompt('PIN mới cho '+u.name+' (4–6 chữ số):');if(!arg)return;if(!/^\d{4,6}$/.test(arg))return toast('PIN phải là 4–6 chữ số')}
      if(a==='rename'){arg=prompt('Tên mới:',u.name);if(!arg)return}
      if(a==='delete'&&!confirm('Xoá vĩnh viễn tài khoản '+u.name+'? Không thể hoàn tác.'))return;
      if(a==='ban'&&!confirm('Khoá tài khoản '+u.name+'? Họ sẽ bị đăng xuất và không đăng nhập được.'))return;
      try{var r=await rpc('learn_admin_user_action',{p_id:u.id,p_action:a,p_arg:arg});if(r&&r.ok===false)return toast(r.error==='taken'?'Tên đã có người dùng':r.error);toast('Đã cập nhật');close();if(a!=='delete')userDrawer(u.id);userTable()}catch(e){toast(e.message)}
    }});
  }
  async function classes(){
    root.innerHTML='<div class="page-head"><div><h1 class="page-title">Lớp học</h1><p class="page-sub">Các lớp do học viên tạo ở /learn. Giáo viên là người tạo lớp hoặc được chuyển quyền.</p></div></div><div id="cv"><p class="muted">Đang tải…</p></div>';
    var d; try{d=await rpc('learn_admin_rooms')}catch(e){return err(e)}
    document.getElementById('cv').innerHTML='<div class="card"><div class="table-wrap"><table><thead><tr><th>Lớp</th><th>Mã</th><th>Khoá</th><th>Chủ lớp</th><th class="num">Thành viên</th><th class="num">Bài tập</th><th class="num">Bài đăng</th><th class="num">Quiz</th><th>Tạo lúc</th><th>Hoạt động</th><th></th></tr></thead><tbody>'+
    ((d||[]).length?d.map(function(r){return '<tr><td><b>'+esc(r.name)+'</b>'+(r.archived?' <span class="pill">Lưu trữ</span>':'')+'</td><td><code>'+esc(r.code)+'</code></td><td>'+(LANG[r.lang]||r.lang)+(r.level?' · '+esc(r.level.toUpperCase()):'')+'</td><td>'+esc(r.owner||'—')+'</td><td class="num">'+r.members+'</td><td class="num">'+r.tasks+'</td><td class="num">'+r.posts+'</td><td class="num">'+r.quizzes+'</td><td>'+dt(r.created_at)+'</td><td>'+ago(r.last)+'</td><td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" data-r="'+r.id+'" data-a="archive">'+(r.archived?'Khôi phục':'Lưu trữ')+'</button> <button class="btn btn-danger btn-sm" data-r="'+r.id+'" data-a="delete">Xoá</button></td></tr>'}).join(''):'<tr><td colspan="11" class="empty">Chưa có lớp nào.</td></tr>')+'</tbody></table></div></div>';
    root.querySelectorAll('[data-r]').forEach(function(b){b.onclick=async function(){if(b.dataset.a==='delete'&&!confirm('Xoá lớp này cho mọi thành viên?'))return;try{await rpc('learn_admin_room_action',{p_id:+b.dataset.r,p_action:b.dataset.a});toast('Đã cập nhật');classes()}catch(e){toast(e.message)}}});
  }
  async function quizzes(){
    root.innerHTML='<div class="page-head"><div><h1 class="page-title">Quiz trực tiếp</h1><p class="page-sub">300 game gần nhất. Người chơi có thể là khách (không cần tài khoản).</p></div></div><div id="qv"><p class="muted">Đang tải…</p></div>';
    var d; try{d=await rpc('learn_admin_games')}catch(e){return err(e)}
    var st={lobby:'<span class="pill warn">Phòng chờ</span>',question:'<span class="pill acc">Đang chơi</span>',reveal:'<span class="pill acc">Đang chơi</span>',board:'<span class="pill acc">Đang chơi</span>',ended:'<span class="pill">Đã xong</span>'};
    var pl=(d||[]).reduce(function(a,g){return a+g.players},0);
    document.getElementById('qv').innerHTML='<div class="stat-grid">'+stat('accent',I.quiz,'Game',fmt((d||[]).length),'')+stat('',I.users,'Lượt người chơi',fmt(pl),fmt((d||[]).reduce(function(a,g){return a+g.guests},0))+' là khách')+'</div><div class="card"><div class="table-wrap"><table><thead><tr><th>Quiz</th><th>Chủ phòng</th><th>Lớp</th><th>Trạng thái</th><th class="num">Câu</th><th class="num">Người chơi</th><th class="num" title="Số câu đúng / (số người chơi × số câu); câu bỏ trống tính là sai">Đúng TB</th><th>Thắng</th><th>Lúc</th></tr></thead><tbody>'+
    ((d||[]).length?d.map(function(g){return '<tr><td><b>'+esc(g.title)+'</b></td><td>'+esc(g.host||'—')+'</td><td>'+esc(g.room||'')+'</td><td>'+(st[g.state]||g.state)+'</td><td class="num">'+g.questions+'</td><td class="num">'+g.players+(g.guests?' <span class="faint">('+g.guests+' khách)</span>':'')+'</td><td class="num">'+(g.accuracy==null?'–':g.accuracy+'%')+'</td><td>'+esc(g.winner||'')+'</td><td>'+dt(g.created_at)+'</td></tr>'}).join(''):'<tr><td colspan="9" class="empty">Chưa có game nào.</td></tr>')+'</tbody></table></div></div>';
  }
  function err(e){var m=e&&e.message||String(e);root.innerHTML+='';var box=root.querySelector('#tv,#lv,#cv,#qv');var t=/forbidden|permission/i.test(m)?'Tài khoản đang đăng nhập không có quyền xem dữ liệu này.':/function .* does not exist|Could not find the function/i.test(m)?'Máy chủ chưa có các hàm thống kê. Cần chạy file learn/setup/learn_social.sql trên Supabase.':m;if(box)box.innerHTML='<div class="card empty">'+esc(t)+'</div>'}
  function show(vw){view=vw;document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.toggle('active',b.dataset.view===vw)});try{history.replaceState(null,'','#'+vw)}catch(e){}({traffic:traffic,learners:learners,classes:classes,quizzes:quizzes})[vw]()}
  document.querySelectorAll('.nav-btn').forEach(function(b){b.onclick=function(){show(b.dataset.view)}});
  document.getElementById('refresh').onclick=function(){show(view)};

  (async function(){
    var s=(await sb.auth.getSession()).data.session;
    if(!s){
      root.innerHTML='<div class="gate"><div class="card"><h2 style="font-family:var(--font-display);font-weight:400;font-size:2rem">Cần đăng nhập</h2><p class="muted">Trang này dùng chung đăng nhập với Profit Tracker. Nhập email quản trị để nhận link đăng nhập.</p><input id="em" type="email" placeholder="email" autocomplete="email"><button class="btn btn-primary" id="go">Gửi link đăng nhập</button><a class="btn btn-ghost" href="../">Mở Profit Tracker</a><p class="faint" id="msg" style="font-size:.84rem"></p></div></div>';
      document.getElementById('go').onclick=async function(){var e=document.getElementById('em').value.trim();if(!e)return;var r=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.origin+location.pathname}});document.getElementById('msg').textContent=r.error?r.error.message:'Đã gửi. Mở email và bấm vào link.'};
      return;
    }
    var h=(location.hash||'').slice(1);show(['traffic','learners','classes','quizzes'].indexOf(h)>=0?h:'traffic');
  })();
})();
</script>
</body>
</html>
